<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07172c" />
  <title>AFL Ground Conditions</title>
  <link rel="icon" type="image/png" href="afl-whiteboard-logo.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{--navy:#07172c;--navy2:#0b2240;--blue:#1473e6;--gold:#ffc928;--red:#d83636;--white:#fff;--panel:rgba(6,18,33,.91)}
    *{box-sizing:border-box}
    html,body,#map{width:100%;height:100%;margin:0}
    body{overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#081525;color:#fff}
    #map{position:absolute;inset:0;z-index:1;background:#101b27}
    .leaflet-control-attribution{font-size:9px!important}
    .topbar{position:absolute;left:14px;right:14px;top:14px;z-index:800;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
    .brand,.info-panel,.wind-panel,.wind-controls,.status-box{pointer-events:auto;box-shadow:0 8px 28px rgba(0,0,0,.32);backdrop-filter:blur(7px)}
    .brand{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.16)}
    .brand img{width:54px;height:54px;border-radius:12px;object-fit:cover}
    .brand strong{display:block;font-size:15px;letter-spacing:.02em}.brand span{display:block;margin-top:2px;color:#c7d4e5;font-size:10px;font-weight:700}
    .info-panel{width:min(320px,43vw);padding:13px 14px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.16)}
    .info-panel h1{font-size:15px;margin:0 0 9px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .info-item{min-width:0}.info-item.wide{grid-column:1/-1}.info-item span{display:block;color:#9fb3ca;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.info-item strong{display:block;margin-top:2px;font-size:12px;line-height:1.25;word-break:break-word}
    .wind-panel{position:absolute;z-index:810;top:92px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.16)}
    .compass{position:relative;width:66px;height:66px;border:2px solid rgba(255,255,255,.9);border-radius:50%;background:rgba(0,0,0,.22)}
    .compass .n,.compass .s,.compass .e,.compass .w{position:absolute;font-size:9px;font-weight:950}.compass .n{top:2px;left:50%;transform:translateX(-50%);color:var(--red)}.compass .s{bottom:2px;left:50%;transform:translateX(-50%)}.compass .e{right:4px;top:50%;transform:translateY(-50%)}.compass .w{left:4px;top:50%;transform:translateY(-50%)}
    .compass-arrow{position:absolute;left:50%;top:50%;width:3px;height:25px;background:var(--gold);transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);border-radius:3px;box-shadow:0 0 6px rgba(255,201,40,.7)}
    .compass-arrow:before{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid var(--gold)}
    .wind-data{min-width:110px}.wind-data span{display:block;color:#a9bad0;font-size:9px;text-transform:uppercase;font-weight:900;letter-spacing:.08em}.wind-data strong{display:block;margin-top:1px;font-size:20px}.wind-data small{display:block;margin-top:1px;color:#d3deea;font-size:10px}
    .wind-controls{position:absolute;z-index:812;top:174px;left:30%;display:flex;gap:6px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,.16)}
    .wind-controls button{width:34px;height:34px;border:0;border-radius:8px;background:#fff;color:#0a2342;font-size:19px;font-weight:950;cursor:pointer}.wind-controls button:hover{background:var(--gold)}
    .wind-overlay{position:absolute;z-index:500;inset:0;pointer-events:none;overflow:hidden}
    .wind-arrow{position:absolute;width:var(--arrow-len,86px);height:4px;border-radius:5px;background:rgba(255,245,75,.90);box-shadow:0 0 6px rgba(0,0,0,.5);transform-origin:50% 50%}
    .wind-arrow:after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid rgba(255,245,75,.96)}
    .map-centre{position:absolute;z-index:520;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.82);border-radius:50%;pointer-events:none}.map-centre:before,.map-centre:after{content:"";position:absolute;background:rgba(255,255,255,.85)}.map-centre:before{width:44px;height:1px;left:-9px;top:13px}.map-centre:after{height:44px;width:1px;top:-9px;left:13px}
    .status-box{position:absolute;left:50%;bottom:18px;z-index:815;transform:translateX(-50%);max-width:min(720px,calc(100vw - 28px));padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid rgba(255,255,255,.16);font-size:11px;color:#dae5f1;text-align:center}
    .status-box.error{border-color:#ff8b8b;color:#ffd3d3}
    @media(max-width:760px){.topbar{top:8px;left:8px;right:8px}.brand{padding:6px}.brand img{width:42px;height:42px}.brand strong{font-size:12px}.brand span{display:none}.info-panel{width:55vw;padding:9px}.info-panel h1{font-size:12px}.info-item strong{font-size:10px}.wind-panel{top:72px;left:37%;transform:translateX(-50%);padding:7px}.compass{width:54px;height:54px}.compass-arrow{height:20px}.wind-data strong{font-size:16px}.wind-controls{top:139px;left:30%}.wind-controls button{width:31px;height:31px}.status-box{bottom:8px}.leaflet-control-zoom{margin-top:150px!important}}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="wind-overlay" id="windOverlay"></div>
  <div class="map-centre" aria-hidden="true"></div>

  <div class="topbar">
    <div class="brand">
      <img src="afl-whiteboard-logo.png" alt="AFL Whiteboard" />
      <div><strong>GROUND CONDITIONS</strong><span>Gumball Spec • All rights reserved</span></div>
    </div>
    <section class="info-panel">
      <h1>Match Information</h1>
      <div class="info-grid">
        <div class="info-item wide"><span>Location</span><strong id="locationText">—</strong></div>
        <div class="info-item"><span>Date</span><strong id="dateText">—</strong></div>
        <div class="info-item"><span>Time</span><strong id="timeText">—</strong></div>
        <div class="info-item wide"><span>Match</span><strong id="matchText">—</strong></div>
        <div class="info-item"><span>Weather</span><strong id="weatherText">—</strong></div>
        <div class="info-item"><span>Rain</span><strong id="rainText">—</strong></div>
        <div class="info-item wide"><span>Ground Surface</span><strong id="groundText">—</strong></div>
      </div>
    </section>
  </div>

  <section class="wind-panel" aria-label="Wind information">
    <div class="compass">
      <span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span>
      <div class="compass-arrow" id="compassArrow"></div>
    </div>
    <div class="wind-data">
      <span>Wind speed</span>
      <strong id="windSpeedText">—</strong>
      <small id="windDirectionText">—</small>
    </div>
  </section>

  <div class="wind-controls" aria-label="Wind overlay controls">
    <button id="windPlus" type="button" title="Increase wind arrows">+</button>
    <button id="windMinus" type="button" title="Decrease wind arrows">−</button>
    <button id="windToggle" type="button" title="Hide/show wind arrows">×</button>
  </div>

  <div id="status" class="status-box">Loading ground map and match weather…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
  (()=>{
    'use strict';
    const q=new URLSearchParams(location.search);
    const num=(key,fallback=NaN)=>{const raw=q.get(key); if(raw===null||raw==='') return fallback; const n=Number(raw); return Number.isFinite(n)?n:fallback;};
    const text=key=>q.get(key)||'';
    const lat=num('lat'), lon=num('lon');
    let windSpeed=num('windSpeed',0), windDirection=num('windDirection',NaN);
    let weather=text('weather'), temperature=text('temperature'), rain=text('rain'), rainChance=text('rainChance');
    let arrowLevel=2, arrowsVisible=true;
    const $=id=>document.getElementById(id);
    const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    const directionLabel=deg=>Number.isFinite(deg)?dirs[Math.round((((deg%360)+360)%360)/22.5)%16]:'';
    const weatherCodeLabel=code=>({0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm with hail',99:'Thunderstorm with hail'}[Number(code)]||'Conditions recorded');
    const setStatus=(message,error=false)=>{$('status').textContent=message;$('status').classList.toggle('error',error);};
    const formatDate=value=>{if(!value)return '—';const d=new Date(value+'T00:00:00');return Number.isNaN(d.getTime())?value:d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});};

    function renderText(){
      $('locationText').textContent=text('location')||`${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      $('dateText').textContent=formatDate(text('date'));
      $('timeText').textContent=text('time')||'—';
      const match=[text('home'),text('away')].filter(Boolean).join(' vs '); $('matchText').textContent=match||'—';
      $('weatherText').textContent=[temperature,weather].filter(Boolean).join(' • ')||'—';
      $('rainText').textContent=[rain,rainChance?`(${rainChance})`:''].filter(Boolean).join(' ')||'—';
      $('groundText').textContent=text('groundCondition')||'—';
      $('groundText').title=text('groundConditionNote')||'';
      $('windSpeedText').textContent=Number.isFinite(windSpeed)?`${Math.round(windSpeed)} km/h`:'—';
      const from=directionLabel(windDirection); $('windDirectionText').textContent=from?`${from} wind • blowing toward ${directionLabel(windDirection+180)}`:'Direction unavailable';
      // Compass arrow points to the direction the wind comes FROM.
      $('compassArrow').style.transform=`translate(-50%,-100%) rotate(${Number.isFinite(windDirection)?windDirection:0}deg)`;
    }

    function renderWindArrows(){
      const overlay=$('windOverlay'); overlay.innerHTML='';
      if(!arrowsVisible||!Number.isFinite(windDirection)) return;
      // Meteorological wind direction is the source direction; arrows show travel direction.
      const travel=(windDirection+180)%360;
      const cols=arrowLevel===1?3:arrowLevel===2?4:6;
      const rows=arrowLevel===1?3:arrowLevel===2?4:5;
      const speedScale=Math.min(1.7,Math.max(.72,(windSpeed||10)/20));
      const len=Math.round((arrowLevel===1?65:arrowLevel===2?82:96)*speedScale);
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        const a=document.createElement('div'); a.className='wind-arrow';
        a.style.left=`${(c+1)*100/(cols+1)}%`; a.style.top=`${20+(r+1)*65/(rows+1)}%`;
        a.style.setProperty('--arrow-len',`${len}px`);
        a.style.transform=`translate(-50%,-50%) rotate(${travel}deg)`;
        a.style.opacity=String(.72+Math.min(.22,(windSpeed||0)/100));
        overlay.appendChild(a);
      }
    }

    async function fetchMatchTimeWeather(){
      const date=text('date'); if(!date||!Number.isFinite(lat)||!Number.isFinite(lon)) return;
      try{
        const today=new Date(); today.setHours(0,0,0,0); const requested=new Date(date+'T00:00:00');
        const historical=requested<today;
        const base=historical?'https://archive-api.open-meteo.com/v1/archive':'https://api.open-meteo.com/v1/forecast';
        const params=new URLSearchParams({latitude:String(lat),longitude:String(lon),start_date:date,end_date:date,hourly:'temperature_2m,weather_code,precipitation,wind_speed_10m,wind_direction_10m',timezone:'auto'});
        const res=await fetch(`${base}?${params}`); if(!res.ok) throw new Error('match-time weather lookup failed');
        const data=await res.json(); if(!data.hourly?.time?.length) return;
        const target=text('time')?`${date}T${text('time').slice(0,5)}`:`${date}T12:00`;
        let idx=0,best=Infinity; data.hourly.time.forEach((v,i)=>{const diff=Math.abs(new Date(v).getTime()-new Date(target).getTime());if(diff<best){best=diff;idx=i;}});
        const sp=Number(data.hourly.wind_speed_10m?.[idx]), dir=Number(data.hourly.wind_direction_10m?.[idx]), temp=Number(data.hourly.temperature_2m?.[idx]), prec=Number(data.hourly.precipitation?.[idx]);
        if(Number.isFinite(sp)) windSpeed=sp; if(Number.isFinite(dir)) windDirection=dir;
        if(Number.isFinite(temp)) temperature=`${Math.round(temp)}°C`;
        if(data.hourly.weather_code?.[idx]!==undefined) weather=weatherCodeLabel(data.hourly.weather_code[idx]);
        if(Number.isFinite(prec)) rain=`${prec.toFixed(prec>=10?0:1)} mm/hr`;
        renderText(); renderWindArrows();
        setStatus(`Weather and wind shown for ${data.hourly.time[idx].replace('T',' ')} at the selected ground.`);
      }catch(err){ setStatus('Map loaded. Using the weather already saved in the Whiteboard because match-time weather could not be refreshed.',false); }
    }

    if(!Number.isFinite(lat)||!Number.isFinite(lon)){
      setStatus('Ground location is unavailable. Return to Setup and use Lookup Location or Get GPS first.',true); return;
    }
    renderText(); renderWindArrows();

    if(typeof L==='undefined'){setStatus('The map library could not be loaded. Check your internet connection and reopen Ground Conditions.',true);return;}
    const map=L.map('map',{zoomControl:true,attributionControl:true}).setView([lat,lon],18);
    const imagery=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri'});
    const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'});
    imagery.addTo(map); L.control.layers({'Satellite':imagery,'Street Map':streets},null,{position:'bottomright'}).addTo(map);
    L.circleMarker([lat,lon],{radius:7,color:'#fff',weight:2,fillColor:'#1473e6',fillOpacity:.8}).addTo(map).bindTooltip(text('location')||'Selected ground',{direction:'top'});
    map.on('zoomend moveend',renderWindArrows);

    $('windPlus').addEventListener('click',()=>{arrowLevel=Math.min(3,arrowLevel+1);arrowsVisible=true;renderWindArrows();});
    $('windMinus').addEventListener('click',()=>{arrowLevel=Math.max(1,arrowLevel-1);arrowsVisible=true;renderWindArrows();});
    $('windToggle').addEventListener('click',()=>{arrowsVisible=!arrowsVisible;renderWindArrows();});
    setStatus('Satellite ground map loaded. Refreshing wind for the match time…');
    fetchMatchTimeWeather();
  })();
  </script>
</body>
</html>
